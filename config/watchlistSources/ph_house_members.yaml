        value: text

      committee_report_page_url:
        selector_type: xpath
        selector: >-
          .//div[normalize-space()='Committee Report:']
          /following-sibling::div[1]
          //a[1]/@href
        value: attribute

      bill_status:
        selector_type: xpath
        selector: >-
          normalize-space(
            string(
              .//div[normalize-space()='Bill Status:']
              /following-sibling::div[1]
            )
          )
        value: text

      bill_status_related_url:
        selector_type: xpath
        selector: >-
          .//div[normalize-space()='Bill Status:']
          /following-sibling::div[1]
          //a[1]/@href
        value: attribute

      mother_bill_status:
        selector_type: xpath
        selector: >-
          normalize-space(
            string(
              .//div[normalize-space()='Mother Bill Status:']
              /following-sibling::div[1]
            )
          )
        value: text

      history_bill_number:
        selector_type: xpath
        selector: >-
          .//a[
            @data-bs-target='#HistoryModal'
            or @data-billno
          ][1]/@data-billno
        value: attribute

      history_congress:
        selector_type: xpath
        selector: >-
          .//a[
            @data-bs-target='#HistoryModal'
            or @data-congress
          ][1]/@data-congress
        value: attribute

      text_as_filed_url:
        selector_type: xpath
        selector: >-
          .//a[
            contains(
              translate(
                normalize-space(.),
                'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                'abcdefghijklmnopqrstuvwxyz'
              ),
              'text as filed'
            )
          ][1]/@href
        value: attribute

      committee_report_document_url:
        selector_type: xpath
        selector: >-
          .//a[
            contains(
              translate(
                normalize-space(.),
                'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                'abcdefghijklmnopqrstuvwxyz'
              ),
              'committee report'
            )
            and contains(
              translate(@href, 'PDF', 'pdf'),
              '.pdf'
            )
          ][1]/@href
        value: attribute

      third_reading_copy_url:
        selector_type: xpath
        selector: >-
          .//a[
            contains(
              translate(
                normalize-space(.),
                'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                'abcdefghijklmnopqrstuvwxyz'
              ),
              'third reading copy'
            )
          ][1]/@href
        value: attribute

      adopted_resolution_url:
        selector_type: xpath
        selector: >-
          .//a[
            contains(
              translate(
                normalize-space(.),
                'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                'abcdefghijklmnopqrstuvwxyz'
              ),
              'adopted resolution'
            )
            or contains(
              translate(
                normalize-space(.),
                'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                'abcdefghijklmnopqrstuvwxyz'
              ),
              'adopted rbh'
            )
          ][1]/@href
        value: attribute


  committee_memberships:
    selector_type: xpath
    selector: >-
      //div[@id='nav-border-top-committee']
      //tbody/tr[
        .//a[contains(@href, '/committees/committee/view/')]
      ]

    fields:
      sequence:
        selector_type: xpath
        selector: >-
          normalize-space(
            substring-before(
              string(./td[1]/a),
              '.'
            )
          )
        value: text

      committee:
        selector_type: xpath
        selector: >-
          normalize-space(
            substring-after(
              string(./td[1]/a),
              '.'
            )
          )
        value: text

      committee_url:
        selector_type: xpath
        selector: >-
          ./td[1]
          /a[contains(@href, '/committees/committee/view/')]
          [1]/@href
        value: attribute

      position:
        selector_type: xpath
        selector: >-
          normalize-space(
            string(
              ./td[2]
              //span[contains(@class, 'hm-position')]
            )
          )
        value: text

      journal:
        selector_type: xpath
        selector: >-
          normalize-space(
            string(
              ./td[2]
              //span[contains(@class, 'journal-chip')]
            )
          )
        value: text


attachments:
  - type: DETAIL_PAGE

  - type: IMAGE
    selector: "div.hm-show-avatar img.profile-img"
    attribute: src


record_id:
  strategy: url_regex
  source: detail_url
  pattern: "/house-members/view/([^/?#]+)"


pagination:
  type: none


storage:
  save_listing_page: false
  save_detail_pages: true

  reuse_saved_detail_pages: true
  minimum_detail_size_bytes: 1000

  listing_role: primary
  detail_role: attachment

  detail_directory: attachments/members