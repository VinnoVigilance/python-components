        value: text

      principal_authors:
        selector_type: xpath
        selector: >-
          .//div[normalize-space()='Principal Authors:']
          /following-sibling::div[1]
          //a//text()
        value: text
        multiple: true

      principal_author_urls:
        selector_type: xpath
        selector: >-
          .//div[normalize-space()='Principal Authors:']
          /following-sibling::div[1]
          //a/@href
        value: attribute
        multiple: true

      date_read:
        selector_type: xpath
        selector: >-
          normalize-space(
            string(
              .//div[normalize-space()='Date Read:']
              /following-sibling::div[1]
            )
