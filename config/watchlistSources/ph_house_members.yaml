        value: text

      primary_referral:
        selector_type: xpath
        selector: >-
          normalize-space(
            string(
              .//div[normalize-space()='Primary Referral:']
              /following-sibling::div[1]
            )
          )
        value: text

      primary_referral_url:
        selector_type: xpath
        selector: >-
          .//div[normalize-space()='Primary Referral:']
          /following-sibling::div[1]
          //a[1]/@href
        value: attribute

      committee_report_number:
        selector_type: xpath
        selector: >-
          normalize-space(
            string(
              .//div[normalize-space()='Committee Report:']
              /following-sibling::div[1]
            )
