fetch_strategy: saved_html

record_mode: list_detail

detail_fetch_strategy: browser

detail_browser:
  headless: false
  wait_selector: ".fugitivedetails-content"
  timeout_seconds: 90
  success_criteria:
    - "Wanted"


discovery:
  row_selector: "div.usa-card__container.usms-most-wanted"
  detail_link_selector: ".usa-card__footer a"
  detail_link_attribute: "href"


list_fields:
  name:
    selector: ".usa-card__heading span"
    selector_type: css
    value: text

  wanted_in:
    selector: ".usms-most-wanted__wanted-in"
    selector_type: css
    value: text

  description:
    selector: ".usms-most-wanted__description"
    selector_type: css
    value: text
    multiple: true

  thumbnail:
    selector: ".usa-card__img img"
    as_attachment: "THUMBNAIL"
    selector_type: css
    value: attribute
    attribute: src


