attachments:
  - type: DETAIL_PAGE

  - type: IMAGE
    selector: ".block-field-blocknodefugitivefield-fugitive-image-asset-file img"
    attribute: "src"
    multiple: true

  - type: DOCUMENT
    selector: ".block-field-blocknodefugitivefield-fugitive-poster a"
    attribute: "href"


record_id:
  strategy: url_regex
  source: detail_url
  pattern: "/([^/?#]+)$"


storage:
  save_listing_page: false
  save_detail_pages: true

  reuse_saved_detail_pages: true
  minimum_detail_size_bytes: 1000

  listing_role: primary
  detail_role: attachment

  detail_directory: attachments/members
