global:
  acquisition:
    crawler_settings:
      record_spool: true
      raw_workers: 4

  mapping:
    file: data/rules/mediaMapping.xlsx

  pre_normalization:
    file: data/rules/mediaPreNormalization.xlsx

  post_normalization:
    file: data/rules/mediaPostNormalization.xlsx


sources:

  ABS_CBN_NEWS:
    enabled: true
    active: true
    source_name: ABS_CBN
    dataset_name: ABS_CBN_NEWS
    dataset_category: Media
    schedule: daily
    date_order: YMD
    source_page_url: https://www.abs-cbn.com/news
    url: https://www.abs-cbn.com/news/nation

    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER
      crawler_settings:
        transport: chrome
        concurrent_requests: 100
        concurrent_requests_per_domain: 100
        download_delay: 0
        randomize_download_delay: false
        retry_times: 3
        retry_http_codes: [403, 408, 429, 500, 502, 503, 504]

    discovery:
      strategy: listing_groups
      policy: full_scan
      skip_known_details: true
      start_url: https://od2-content-api.abs-cbn.com/prod/latest
      params: {brand: NEWS, partner: imp-01}
      items_path: listItem
      url_path: slugline_url
      sort_date_path: createdDateFull
      article_base_url: https://www.abs-cbn.com/
      pagination: {type: offset, page_size: 12, size_param: limit, offset_param: offset}
      groups:
        - params: {sectionId: nation}
        - params: {pageCategory: pmss}
        - params: {sectionId: business}
        - params: {pageCategory: duterte-at-the-icc}
        - params: {pageCategory: sara-duterte-impeachment-trial}
        - url: https://www.abs-cbn.com/war-on-drugs
          link_selector: 'a[href*="/war-on-drugs/part"]'
          include_page: true

    discovery_by_mode:
      INITIAL:
        policy: full_scan
      INCREMENTAL:
        policy: stop_after_known
        threshold: 10

    extraction:
      SourceURL: {source: response_url}
      SourceRecordId:
        source: response_url
        extraction:
          strategy: regex
          # Listings contain both YYYY/M/D and older M/D/YY URLs across sections.
          pattern: '^https://www\.abs-cbn\.com/((?:[^/?#]+/)*(?:\d{4}/\d{1,2}/\d{1,2}|\d{1,2}/\d{1,2}/\d{2})/[^/?#]+|war-on-drugs(?:/part\d+)?)/?(?:[?#].*)?$'
      Title: {selector: 'h1', required: true}
      BodyText:
        selector: '#bodyTopPart p, #bodyBottomPart p'
        required: true
        join_with: "\n\n"
      date.originalValue: {selector: 'meta[property="article:published_time"]', output: attribute, attribute: content, required: true}
      AuthorName: {selector: 'meta[name="author"]', output: attribute, attribute: content}
      Summary: {selector: 'meta[property="og:description"]', output: attribute, attribute: content}
      FeaturedImageUrl: {selector: 'meta[property="og:image"]', output: attribute, attribute: content}
    extraction_by_url:
      - pattern: '/war-on-drugs(?:/|$)'
        fields:
          Title: {selector: 'title'}
          date.originalValue: {required: false}
          AuthorName: {selector: '.author-name'}
          BodyText:
            selector: '[role="main"] p, [role="main"] h2'
            join_with: "\n\n"

    parser: {type: html}
    identity:
      external_id: {field: SourceRecordId}
      record_key:
        fields: [source_name, dataset_name, SourceRecordId]

  PHILSTAR_NEWS:
    enabled: true
    active: true
    source_name: PHILSTAR_NEWS
    dataset_name: PHILSTAR_NEWS
    dataset_category: Media
    schedule: hourly
    date_order: MDY
    source_page_url: https://www.philstar.com/headlines
    url: https://www.philstar.com/headlines

    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER
      crawler_settings:
        transport: chrome
        concurrent_requests: 100
        concurrent_requests_per_domain: 100
        download_delay: 0
        randomize_download_delay: false
        retry_times: 3
        retry_http_codes: [403, 408, 429, 500, 502, 503, 504]

    discovery:
      strategy: listing_groups
      policy: full_scan
      parallel_groups: true
      skip_known_details: true
      article_base_url: https://www.philstar.com/
      groups:
        - url: https://www.philstar.com/headlines
          link_selector: 'a[href^="https://www.philstar.com/headlines/20"]'
          pagination: {type: next_link, selector: 'div.next > a[href]'}
        - url: https://www.philstar.com/nation
          link_selector: 'a[href^="https://www.philstar.com/nation/20"]'
          pagination: {type: next_link, selector: 'div.next > a[href]'}
        - url: https://www.philstar.com/business
          link_selector: 'a[href^="https://www.philstar.com/business/20"]'
          pagination: {type: next_link, selector: 'div.next > a[href]'}
        - url: https://www.philstar.com/business/banking
          link_selector: 'a[href^="https://www.philstar.com/business/banking/20"]'
          pagination: {type: next_link, selector: 'div.next > a[href]'}

    discovery_by_mode:
      INITIAL: {policy: full_scan}
      INCREMENTAL:
        strategy: rss
        policy: full_scan
        article_url_pattern: '^https://www\.philstar\.com/(?:headlines|nation|business(?:/banking)?|banking)/\d{4}/\d{2}/\d{2}/\d+/'
        feed_urls:
          - https://www.philstar.com/rss/headlines
          - https://www.philstar.com/rss/nation
          - https://www.philstar.com/rss/business
          - https://www.philstar.com/rss/business/banking

    extraction:
      SourceURL: {source: response_url}
      SourceRecordId:
        source: response_url
        extraction:
          strategy: regex
          pattern: '^https://www\.philstar\.com/(?:headlines|nation|business(?:/banking)?|banking)/\d{4}/\d{2}/\d{2}/(\d+)/'
      Title: {selector: 'h1', required: true}
      BodyText: {selector: 'div.article__writeup', required: true}
      CategoryName: {selector: '.article__section-name'}
      date.originalValue:
        selector: '.article__date-published'
        required: true
        extraction: {strategy: regex, pattern: '^([A-Za-z]+ \d{1,2}, \d{4})'}
      AuthorName: {selector: 'meta[name="author"]', output: attribute, attribute: content}
      Summary: {selector: 'meta[property="og:description"]', output: attribute, attribute: content}
      FeaturedImageUrl: {selector: 'meta[property="og:image"]', output: attribute, attribute: content}
      KeywordText: {selector: 'meta[name="keywords"]', output: attribute, attribute: content}

    parser: {type: html}
    identity:
      external_id: {field: SourceRecordId}
      record_key:
        fields: [source_name, dataset_name, SourceRecordId]

  NCA_NEWS:
    enabled: true
    active: true
    source_name: NCA
    dataset_name: NCA_NEWS
    dataset_category: Media
    schedule: daily
    date_order: DMY
    source_page_url: https://www.nationalcrimeagency.gov.uk/news
    url: https://www.nationalcrimeagency.gov.uk/news

    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER
      crawler_settings:
        transport: chrome
        concurrent_requests_per_domain: 3
        download_delay: 0.25
        retry_times: 3
        retry_http_codes: [403, 408, 429, 500, 502, 503, 504]

    discovery:
      strategy: rss
      policy: full_scan
      feed_urls:
        - https://www.nationalcrimeagency.gov.uk/news?format=feed&type=rss
      pagination: {type: offset, page_size: 20, offset_param: start, size_param: null}
      use_item_pub_date: true

    discovery_by_mode:
      INITIAL: {policy: full_scan}
      INCREMENTAL: {policy: stop_after_known, threshold: 10}

    extraction:
      SourceURL: {source: response_url}
      SourceRecordId:
        source: response_url
        extraction:
          strategy: regex
          pattern: '^https://www\.nationalcrimeagency\.gov\.uk/news/([^/?#]+)'
      Title: {selector: 'h1[itemprop="headline"]', required: true}
      BodyText: {selector: '[itemprop="articleBody"]', required: true}
      Summary: {selector: 'meta[property="og:description"]', output: attribute, attribute: content}
      FeaturedImageUrl: {selector: 'meta[property="og:image"]', output: attribute, attribute: content}
      TagNames: {selector: 'li[itemprop="keywords"] > a.label', multiple: true}
      date.originalValue: {selector: '[itemprop="articleBody"] > p:last-of-type > strong'}

    parser: {type: html}
    identity:
      external_id: {field: SourceRecordId}
      record_key:
        fields: [source_name, dataset_name, SourceRecordId]

  COURT_OF_APPEALS_PH_DECISIONS_AND_RESOLUTIONS:
    enabled: true
    active: true
    source_name: COURT_OF_APPEALS_PH
    dataset_name: COURT_OF_APPEALS_PH_DECISIONS_AND_RESOLUTIONS
    dataset_category: Crime / Judicial Records
    schedule: daily
    date_order: MDY
    source_page_url: https://services.ca.judiciary.gov.ph/recentdecisions/
    url: https://services.ca.judiciary.gov.ph/recentdecisions/
    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER
      crawler_settings:
        concurrent_requests_per_domain: 1
        download_delay: 1
        retry_times: 3
    discovery:
      policy: full_scan
      strategy: form_search
      form_search: &ca_recent
        start_url: https://services.ca.judiciary.gov.ph/recentdecisions/
        metadata:
          DiscoveryMethod: recent
        stages:
        - selector_type: xpath
          row_selector: //table[@id='tbl-table']/tbody/tr
          row_key:
          - Station
          - CaseNumber
          - date.originalValue
          unsupported_pagination_selector: //*[contains(concat(' ', normalize-space(@class), ' '), ' ui-paginator ')]
          fields:
            CaseNumber:
              selector: td:nth-child(1) span
              required: true
            Station:
              selector: td:nth-child(2) .station-value
              required: true
              values:
                MANILA: mnl
                VISAYAS: ceb
                CEBU: ceb
                MINDANAO: cdo
                CAGAYAN DE ORO: cdo
            Title:
              selector: td:nth-child(3) p
              required: true
            date.originalValue:
              selector: td:nth-child(1)
              required: true
              extraction:
                strategy: regex
                pattern: \(([A-Za-z]+ \d{1,2}, \d{4})\)
          action:
            submit_selector: form a[onclick][id]
        document:
          type: pdf
          identity_fields: &ca_document_identity
          - Station
          - CaseNumber
          - date.originalValue
          - FileHash
    parser:
      type: pdf
      mode: text
      require_text: true
      ocr_fallback: {}
    identity:
      external_id:
        field: SourceRecordId
      record_key:
        fields:
        - source_name
        - dataset_name
        - SourceRecordId
        hash: true
    discovery_by_mode:
      INITIAL:
        form_search:
        - &ca_historical
          start_url: https://services.ca.judiciary.gov.ph/csisver3-war/
          parameters:
            station:
              values:
              - mnl
            case_number:
              range:
                start: 1
                end: 300000
              format: 05d
          parameter_fields:
            Station: station
          metadata:
            DiscoveryMethod: historical
          search_action:
            form_xpath: //form[@id="searching"]
            fields:
              searching:radio-id: '{station}'
              searching:dt-search-0: '{case_number}'
              searching:search-button: ''
          stages:
          - selector_type: xpath
            row_selector: //table[@id='tbl-table']/tbody/tr
            row_key:
            - CaseNumber
            unsupported_pagination_selector: //*[contains(concat(' ', normalize-space(@class), ' '), ' ui-paginator ')]
            fields:
              CaseNumber:
                selector: td:nth-child(1)
                required: true
              Title:
                selector: td:nth-child(3) p
                required: true
              CaseStatus:
                selector: td:nth-child(4)
            action:
              submit_selector: form a[onclick][id]
            empty_source: html
            empty_pattern: No record.*?Retrieved
          - selector_type: xpath
            row_selector: //table[@id='tbl-table']/tbody/tr
            row_key:
            - date.originalValue
            unsupported_pagination_selector: //*[contains(concat(' ', normalize-space(@class), ' '), ' ui-paginator ')]
            fields:
              date.originalValue:
                selector: td:nth-child(1)
                required: true
                extraction:
                  strategy: regex
                  pattern: ([A-Za-z]+ \d{1,2}, \d{4})
            action:
              submit_selector: form a[onclick][id]
            empty_pattern: Decisions / Resolutions No data available\.
            page_fields:
              CaseDetailText:
                selector_type: xpath
                selector: //body
          document:
            type: pdf
            identity_fields: *ca_document_identity
        - <<: *ca_historical
          parameters:
            station:
              values: [ceb]
            case_number:
              range: {start: 1, end: 40000}
              format: 05d
        - <<: *ca_historical
          parameters:
            station:
              values: [cdo]
            case_number:
              range: {start: 1, end: 30000}
              format: 05d
        - *ca_recent
      INCREMENTAL:
        form_search: *ca_recent

  GMA_NEWS:
    enabled: true
    active: true

    source_name: GMA_NEWS
    dataset_name: GMA_NEWS
    dataset_category: Media
    schedule: daily
    date_order: YMD

    source_page_url: https://www.gmanetwork.com/news/
    url: https://www.gmanetwork.com/news/archives/news-nation/

    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER
      crawler_settings:
        concurrent_requests_per_domain: 1
        download_delay: 1
        retry_times: 3

    discovery:
      policy: full_scan

    discovery_by_mode:
      INITIAL:
        strategy: archive_listings

        acquisition:
          fetch_strategy: saved_html
          download_method: BYPASS
          detail_fetch_strategy: direct
          crawler_settings:
            concurrent_requests_per_domain: 3
            download_delay: 0.05
            retry_times: 3

        archive_urls:
          - https://www.gmanetwork.com/news/archives/news-nation/
          - https://www.gmanetwork.com/news/archives/news-metro/
          - https://www.gmanetwork.com/news/archives/news-regions/
          - https://www.gmanetwork.com/news/archives/news-specialreports/
          - https://www.gmanetwork.com/news/archives/money/
          - https://www.gmanetwork.com/news/archives/money-personalfinance/
          - https://www.gmanetwork.com/news/tracking/

        article:
          link_selector: '#grid_thumbnail_stories a[href*="/story/"]'

        bypass_config:
          engine: stealth_browser
          headless: true
          timeout_seconds: 120

          actions:
            - action: wait
              type: selector
              selector: '#grid_thumbnail_stories a[href*="/story/"]'
              timeout: 60

            - action: scroll_until_idle
              link_selector: '#grid_thumbnail_stories a[href*="/story/"]'
              overlay_close_selector: '#tbl-explore-more-header button[aria-label*="close" i], #tbl-explore-more-header [role="button"][aria-label*="close" i], #tbl-explore-more-header button[title*="close" i]'
              idle_timeout_seconds: 90
              poll_interval_seconds: 2

            - action: save_html
              filename_pattern: '{source}_{list}_{timestamp}.html'

      INCREMENTAL:
        strategy: rss

        acquisition:
          fetch_strategy: direct
          download_method: CRAWLER
          crawler_settings:
            concurrent_requests_per_domain: 3
            download_delay: 0.05
            retry_times: 3

        feed_urls:
          - https://data.gmanetwork.com/gno/rss/news/nation/feed.xml
          - https://data.gmanetwork.com/gno/rss/news/metro/feed.xml
          - https://data.gmanetwork.com/gno/rss/news/regions/feed.xml
          - https://data.gmanetwork.com/gno/rss/news/specialreports/feed.xml
          - https://data.gmanetwork.com/gno/rss/money/feed.xml
          - https://data.gmanetwork.com/gno/rss/money/personalfinance/feed.xml

    extraction:
      SourceURL:
        source: response_url

      SourceRecordId:
        source: response_url
        extraction:
          strategy: regex
          pattern: '/news/(?:[^/?#]+/)+([0-9]+)/[^/?#]+/story(?:/|[?#]|$)'

      Title:
        selector: 'meta[property="og:title"]'
        output: attribute
        attribute: content

      date.originalValue:
        selector: 'meta[property="og:pubdate"], meta[name="og:pubdate"]'
        output: attribute
        attribute: content

      BodyText:
        selector: '.story_main'
        output: text

      AuthorName:
        selector: 'meta[name="author"]'
        output: attribute
        attribute: content

      Summary:
        selector: 'meta[property="og:description"]'
        output: attribute
        attribute: content

      FeaturedImageUrl:
        selector: 'meta[property="og:image"]'
        output: attribute
        attribute: content

      TagNames:
        selector: '.automatic_tags a.automatic-tag-link'
        output: text
        multiple: true

    required_article_fields:
      - Title
      - BodyText

    parser:
      type: html

    identity:
      external_id:
        field: SourceRecordId
      record_key:
        fields:
          - source_name
          - dataset_name
          - SourceRecordId

  SUPREME_COURT_PH_DECISIONS_AND_SIGNED_RESOLUTIONS:
    enabled: true
    active: true
    source_name: SUPREME_COURT_PH
    dataset_name: SUPREME_COURT_PH_DECISIONS_AND_SIGNED_RESOLUTIONS
    dataset_category: Crime / Judicial Records
    schedule: daily
    date_order: MDY
    source_page_url: https://elibrary.judiciary.gov.ph/thebookshelf/1
    url: https://elibrary.judiciary.gov.ph/thebookshelf/1
    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER
      crawler_settings:
        concurrent_requests_per_domain: 1
        download_delay: 1
        retry_times: 3
    discovery:
      strategy: dated_month_archive
      policy: stop_after_known
      threshold: 20
      month_link_selector: 'a[href*="/thebookshelf/docmonth/"]'
      article:
        link_selector: 'a[href*="/thebookshelf/showdocs/1/"]'
    extraction:
      SourceURL:
        source: response_url
      SourceRecordId:
        source: response_url
        strategy: regex
        pattern: '/showdocs/1/(\d+)'
      Title:
        selector: '#left .single_content h3'
        output: text
      date.originalValue:
        selector: '#left .single_content h2:contains("[")'
        output: text
        extraction:
          strategy: regex
          pattern: '([A-Za-z]+\s+\d{1,2},\s+\d{4})'
      BodyText:
        selector: '#left .single_content'
        output: text
    parser:
      type: html
    identity:
      external_id:
        field: SourceRecordId
      record_key:
        fields: [source_name, dataset_name, SourceRecordId]

  ONENEWS_PH_POLITICS_AND_OTHER_NEWS_FEATURES:
    enabled: true
    active: true
    source_name: ONENEWS_PH
    dataset_name: ONENEWS_PH_POLITICS_AND_OTHER_NEWS_FEATURES
    dataset_category: Media
    schedule: daily
    date_order: YMD
    preserve_url_whitespace: true
    source_page_url: https://www.onenews.ph/categories/3_politics-and-other-news-features
    url: https://onecms.cignal.tv/services/api/Articles/GetByCategoryWithPagination
    acquisition:
      type: api
      download_method: API
    discovery:
      policy: stop_after_known
      threshold: 20
    api_config:
      params:
        verticalid: 2
        categoryid: 3
        subverticalid: ""
      pagination:
        type: page
        page_param: pageno
        size_param: pagerow
        page_size: 10
        start_page: 1
      items_path: ""
      write_mode: record_files
      record_id_path: id
      transport: requests
      timeout: 30
      throttle_delay: 1
      page_token:
        url: https://www.onenews.ph/categories/3_politics-and-other-news-features
        pattern: 'auth:\{token:"([^"]+)"'
    parser:
      type: json
    identity:
      external_id:
