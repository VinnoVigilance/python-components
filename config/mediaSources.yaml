  US_TREASURY_PRESS_RELEASES:
    enabled: true
    active: true
    source_name: US_TREASURY
    dataset_name: US_TREASURY_PRESS_RELEASES
    dataset_category: Media
    schedule: daily
    date_order: MDY
    source_page_url: https://home.treasury.gov/news/press-releases/
    url: https://home.treasury.gov/news/press-releases/

    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER
      crawler_settings:
        concurrent_requests_per_domain: 1
        download_delay: 1
        randomize_download_delay: true
        retry_times: 3

    discovery:
