global:
  mapping:
    file: data/rules/mediaMapping.xlsx

  pre_normalization:
    file: data/rules/mediaPreNormalization.xlsx

  post_normalization:
    file: data/rules/mediaPostNormalization.xlsx


sources:
  NBI_PRESS_RELEASES:
    enabled: true
    active: true

    source_name: NBI
    dataset_name: NBI_PRESS_RELEASES
    dataset_category: PRESS_RELEASE

    schedule: daily

    url: https://nbi.gov.ph/press_releases/

    date_order: MDY

    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER

      crawler_settings:
        concurrent_requests_per_domain: 1
        download_delay: 2
        randomize_download_delay: true
        retry_times: 3

        retry_http_codes:
          - 408
          - 429
          - 500
          - 502
          - 503
          - 504
          - 521
          - 522
          - 524

    discovery:
      strategy: list_detail

      start_url: https://nbi.gov.ph/press_releases/
      start_page: 1

      pagination:
        type: page_number
        url_pattern: "https://nbi.gov.ph/press_releases/page/{page}/"

      article:
        link_selector: "h2 a"

      known_record:
        field: SourceRecordId

      stop_condition:
        type: consecutive_known_records
        threshold: 10

    extraction:
      SourceURL:
        source: response_url

      SourceRecordId:
        source: response_url
        strategy: regex
        pattern: "/(\\d+)/?$"

      Title:
        selector: "h1"
        output: text

      date.originalValue:
        selector: "body"
        output: text
        extraction:
          strategy: regex
          pattern: "Posted on\\s+([A-Za-z]+\\s+\\d{1,2},\\s+\\d{4})\\s+by\\s+"

      AuthorName:
        selector: "body"
        output: text
        extraction:
          strategy: regex
          pattern: "Posted on\\s+[A-Za-z]+\\s+\\d{1,2},\\s+\\d{4}\\s+by\\s+(.+?)\\s+PRESS STATEMENT\\b"

      BodyText:
        selector: ".entry-content"
        output: text

    parser:
      type: html

    identity:
      external_id:
        field: SourceRecordId

      record_key:
        fields:
          - source_name
          - dataset_name
          - SourceRecordId

  AMLC_NEWS_AND_ANNOUNCEMENTS:
    enabled: true
    active: true

    source_name: AMLC
    dataset_name: AMLC_NEWS_AND_ANNOUNCEMENTS
    dataset_category: PRESS_RELEASE

    schedule: daily
    date_order: YMD

    source_page_url: https://www.amlc.gov.ph/news-and-announcements

    url: https://www.amlc.gov.ph/api/news/combined/feed

    acquisition:
      type: api
      download_method: API

    api_config:
      pagination:
        type: page
        page_param: page
        size_param: limit
        page_size: 100
        start_page: 1

      items_path: data

      write_mode: record_files
      record_id_path: id

      transport: requests
      timeout: 30
      retry: 3
      throttle_delay: 0.2

    parser:
      type: json

    identity:
      external_id:
        field: id

      record_key:
        fields:
          - source_name
          - dataset_name
          - id

    preprocessing:
      - handler: build_url_from_template
        level: record
        config:
          output_field: SourceURL
          template: "https://www.amlc.gov.ph/news-and-announcements/{id}?type={type}"

  PCIJ_CORRUPTION_WATCH:
    enabled: true
    active: true

    source_name: PCIJ
    dataset_name: PCIJ_CORRUPTION_WATCH
    dataset_category: News Article

    schedule: daily

    url: https://pcij.org/category/corruption-watch/

    date_order: MDY

    acquisition:
      type: crawler
      spider: media
      download_method: CRAWLER

      crawler_settings:
        concurrent_requests_per_domain: 1
        download_delay: 2
        randomize_download_delay: true
        retry_times: 3

        retry_http_codes:
          - 408
          - 429
          - 500
          - 502
          - 503
          - 504
          - 521
          - 522
          - 524

    discovery:
      strategy: list_detail

      start_url: https://pcij.org/category/corruption-watch/
      start_page: 1

      pagination:
        type: page_number
        url_pattern: "https://pcij.org/category/corruption-watch/page/{page}/"

      article:
        link_selector: "h2.entry-title a"

      known_record:
        field: SourceRecordId

      stop_condition:
        type: consecutive_known_records
        threshold: 10

    extraction:
      SourceURL:
        source: response_url

      SourceRecordId:
        source: response_url
        strategy: regex
        pattern: "//[^/]+/(.+?)/*$"

      Title:
        selector: "h1.entry-title"
        output: text

      date.originalValue:
        selector: ".entry-header time.entry-date"
        output: attribute
        attribute: datetime

      AuthorName:
        selector: ".entry-header .byline"
        output: text
        extraction:
          strategy: regex
          pattern: "[Bb]y\\s+(.+)"

      BodyText:
        selector: ".entry-content"
        output: text

      TableEmbedUrls:
        selector: ".entry-content .flourish-table"
        output: attribute
        attribute: data-src
        multiple: true
        prefix: "https://public.flourish.studio/"

      ChartEmbedUrls:
        selector: ".entry-content .flourish-chart"
        output: attribute
        attribute: data-src
        multiple: true
        prefix: "https://public.flourish.studio/"

      DashboardEmbedUrls:
        selector: ".entry-content iframe[src*='datawrapper']"
        output: attribute
        attribute: src
        multiple: true

      DocumentUrls:
        selector: ".entry-content .wp-block-file__embed"
        output: attribute
        attribute: data
        multiple: true

    parser:
      type: html

    identity:
      external_id:
        field: SourceRecordId

      record_key:
        fields:
          - source_name
          - dataset_name
          - SourceRecordId