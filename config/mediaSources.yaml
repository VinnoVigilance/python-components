  DOJ_PH_NEWS:
    enabled: true
    active: true

    source_name: DOJ_PH
    dataset_name: DOJ_PH_NEWS
    dataset_category: PRESS_RELEASE

    schedule: daily

    url: https://www.doj.gov.ph/news.html

    date_order: DMY

    acquisition:
      type: crawler
      spider: media
      fetch_strategy: saved_html
      download_method: BYPASS

      crawler_settings:
        concurrent_requests_per_domain: 1
        download_delay: 2
        randomize_download_delay: true
        retry_times: 3

    bypass_config:
      challenge: cloudflare
      headless: false
      timeout_seconds: 120

      success_criteria:
        - "News Articles"

      actions:
        - action: wait
          type: selector
          selector: "#blog-full-width"
          timeout: 120

        - action: save_html
          filename_pattern: "{source}_{list}_{timestamp}.html"

      validation:
        required_content:
          - "news_article.html?newsid="

        min_size_bytes: 10000

    detail_fetch_strategy: browser

    detail_browser:
      headless: false
      timeout_seconds: 120

      wait_selector: ".single-post .post-content"

      success_criteria:
        - "More News Articles"

    storage:
      save_detail_pages: true
      reuse_saved_detail_pages: false
      minimum_detail_size_bytes: 5000

    discovery:
      strategy: list_detail
      policy: stop_after_known
      threshold: 10

      start_url: https://www.doj.gov.ph/news.html
      start_page: 1

      pagination:
        type: none

      article:
        link_selector: "#blog-full-width h3.blogpost-title a, #blog-full-width table td[align='justify'] > a"

        # DOJ regenerates the newsid query token on every listing request.
        # Published date + normalized title stays stable for the same article.
        identity_fields:
          ListingPublishedDate:
            source: xpath
            selectors:
              - "ancestor::article[1]//*[contains(concat(' ', normalize-space(@class), ' '), ' blog-meta ')]/span[1]//text()"
              - "ancestor::tr[1]/td[1]//text()"

          ListingTitle:
            source: link_text
            required: false

    extraction:
      SourceURL:
        source: response_url

      Title:
        selector: ".global-page-header h2"
        output: text

      Summary:
        selector: "meta[name='description']"
        output: attribute
        attribute: content

      date.originalValue:
        selector: ".global-page-header .portfolio-meta span"
        output: text

      BodyOriginalValue:
        selector: ".single-post .post-content"
        output: html

    parser:
      type: html

    identity:
      record_key:
        fields:
          - source_name
          - dataset_name
          - ListingPublishedDate
          - ListingTitle

        hash: true

  UK_GOV_NEWS_COMMUNICATIONS:
    enabled: true
    active: true

    source_name: UK_GOV
    dataset_name: UK_GOV_NEWS_COMMUNICATIONS
    dataset_category: News Article

    schedule: daily
    date_order: YMD

    source_page_url: https://www.gov.uk/search/news-and-communications

    url: https://www.gov.uk/api/search.json

    acquisition:
      type: api
      download_method: API

    discovery:
      policy: stop_after_known
      threshold: 10

    api_config:
      params:
        filter_content_purpose_supergroup: news_and_communications
        reject_content_purpose_subgroup: decisions
        order: "-public_timestamp"
        fields: "title,link,description,public_timestamp,updated_at,content_store_document_type,format,organisations,primary_publishing_organisation,people,roles,world_locations,topical_events,content_id,content_purpose_subgroup,indexable_content"

      pagination:
        type: offset
        offset_param: start
        size_param: count
        page_size: 1000
        start_page: 0

      items_path: results

      write_mode: record_files
      record_id_path: link

      transport: requests
      timeout: 30
      retry: 3
      retry_delay_seconds: 1
      retry_backoff_multiplier: 2
      retry_max_delay_seconds: 8
      throttle_delay: 0.5

    parser:
      type: json

    identity:
      external_id:
        field: content_id

      record_key:
        fields:
          - source_name
          - dataset_name
          - content_id

    preprocessing:
      - handler: build_url_from_template
        level: record
        config:
          output_field: SourceURL
          template: "https://www.gov.uk{link}"

      - handler: build_url_from_template
        level: record
        config:
          output_field: ContentApiUrl
          template: "https://www.gov.uk/api/content{link}"

