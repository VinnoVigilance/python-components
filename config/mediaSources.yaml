      minimum_detail_size_bytes: 5000

    document_download:
      required: true
      store_as_record_file: true
      url_fields:
        - PdfButtonUrl
        - PdfViewerUrl

    discovery:
      strategy: list_detail
      policy: stop_after_known
      threshold: 10

      start_url: https://www.sec.gov.ph/investors-education-and-information/advisories/
      start_page: 1

      pagination:
        type: none

      article:
        link_selector: "ul.lcp_catlist li a"

    extraction:
      SourceURL:
        source: response_url

      SourceRecordId:
        source: response_url
        strategy: regex
        pattern: "//[^/]+/(.+?)/*$"

      PostId:
        selector: "article[id^='post-']"
        output: attribute
        attribute: id
        extraction:
          strategy: regex
          pattern: 'post-(\d+)'

      Title:
        selector: "h1.entry-title"
        output: text

      date.originalValue:
        selector: "meta[property='article:published_time']"
        output: attribute
        attribute: content

      DateModified:
        selector: "script.yoast-schema-graph"
        output: text
        extraction:
          strategy: regex
          pattern: '"dateModified":"([^"]+)"'

      AuthorName:
        selector: "script.yoast-schema-graph"
        output: text
        extraction:
          strategy: regex
          pattern: '"author":\{"name":"([^"]+)"'

      Language:
        selector: "script.yoast-schema-graph"
        output: text
        extraction:
          strategy: regex
          pattern: '"inLanguage":"([a-z]{2})'

      ArticleSection:
        selector: "script.yoast-schema-graph"
        output: text
        extraction:
          strategy: regex
          pattern: '"articleSection":\[([^\]]*)\]'

      HtmlBodyText:
        selector: ".module_column.col4-3 .tb_text_wrap > div:not(.wp-block-cgb-block-algori-pdf-viewer)"
        output: text

      PdfButtonUrl:
        selector: ".module-buttons a[href*='.pdf']"
        output: attribute
        attribute: href

      PdfViewerUrl:
        selector: "iframe.wp-block-cgb-block-algori-pdf-viewer-iframe"
        output: html
        extraction:
          strategy: regex
          pattern: '(?:file=|src=")([^"&?]+?\.pdf)'

    parser:
      type: pdf
      mode: text
      require_text: true
      ocr_fallback: {}

    identity:
      external_id:
        field: PostId

      record_key:
        fields:
          - source_name
          - dataset_name
          - SourceRecordId


