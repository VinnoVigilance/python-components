source:
  id: nbi_ph
  name: National Bureau of Investigation
  section: press_releases
  source_url: https://nbi.gov.ph/press_releases/

acquisition:
  method: crawler
  engine: scrapy
  supported_modes:
    - automatic
    - manual
  manual:
    allowed_file_types:
      - html
      - htm
      - pdf

defaults:
  source:
    id: nbi_ph
    record_id: null
    name: National Bureau of Investigation
    section: press_releases
  urls:
    source: https://nbi.gov.ph/press_releases/
    discovery: null
    article: null
  classification:
    record_type: press_release
    document_type: press_release
  content:
    title: null
    subtitle: null
    summary: null
    description: null
    lead_text: null
    article_text: null
    article_html: null
    sections: []
  dates:
    published_date: null
    updated_date: null
    effective_date: null
    expiry_date: null
  publisher:
    name: National Bureau of Investigation
    authors: []
  taxonomy:
    language: null
    categories: []
    tags: []
    topics: []
    keywords: []
  media:
    featured_image_url: null
    image_urls: []
    video_urls: []
  files:
    attachments: []
  references:
    reference_numbers: []
  links:
    related_links: []
  feed:
    rss_guid: null

discovery:
  type: rss
  url: https://nbi.gov.ph/press_releases/feed/
  item_xpath: //channel/item
  namespaces:
    content: http://purl.org/rss/1.0/modules/content/
    dc: http://purl.org/dc/elements/1.1/
  mapping:
    source.record_id:
      xpath: guid/text()
      multiple: false
    urls.article:
      xpath: link/text()
      multiple: false
    content.title:
      xpath: title/text()
      multiple: false
    content.summary:
      xpath: description/text()
      multiple: false
      clean_html: true
    dates.published_date:
      xpath: pubDate/text()
      multiple: false
    publisher.authors:
      xpath: dc:creator/text()
      multiple: true
    taxonomy.categories:
      xpath: category/text()
      multiple: true
    feed.rss_guid:
      xpath: guid/text()
      multiple: false

pagination:
  type: query_parameter
  parameter: paged
  start_page: 1
  stop_on_empty_page: true
  stop_when_all_articles_known: true
  stop_http_statuses:
    - 404

article:
  parser: html
  selectors:
    content.title:
      css: h1.entry-title::text
      multiple: false
    content.subtitle:
      css: .entry-subtitle::text
      multiple: false
    content.description:
      css: meta[name="description"]::attr(content)
      multiple: false
    content.lead_text:
      css: .entry-content .lead::text
      multiple: false
    content.article_text:
      css: .entry-content ::text
      multiple: true
      join_with: " "
    content.article_html:
      css: .entry-content
      output: html
      multiple: false
    dates.published_date:
      css: time.entry-date::attr(datetime)
      multiple: false
    dates.updated_date:
      css: time.updated::attr(datetime)
      multiple: false
    publisher.authors:
      css: .author a::text
      multiple: true
    taxonomy.language:
      css: html::attr(lang)
      multiple: false
    media.featured_image_url:
      css: meta[property="og:image"]::attr(content)
      multiple: false
      output: url
    media.image_urls:
      css: .entry-content img::attr(src)
      multiple: true
      output: url
    media.video_urls:
      css: .entry-content iframe::attr(src)
      multiple: true
      output: url
    files.attachments:
      css: .entry-content a
      multiple: true
      output: attachment
    links.related_links:
      css: .entry-content a
      multiple: true
      output: link

storage:
  mode: per_record
  save_raw_response: true
  root_directory: data/downloads
  directory_template: "{source_id}/{section}/year={year}/month={month}/day={day}/run={run_id}"
  filename_template: "{record_key}.{extension}"

deduplication:
  keys:
    - source.record_id
    - urls.article

output:
  format: jsonl
  path: data/final/nbi_press_releases.jsonl
