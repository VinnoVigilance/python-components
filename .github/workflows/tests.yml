# GitHub Actions workflow -- the "robot" (Continuous Integration).
#
# GitHub runs this automatically on a fresh Linux machine every time someone
# pushes to main/staging or opens a pull request into them. If any test fails,
# the commit / PR gets a red X and the pusher gets an email.
#
# No GitLab or external service needed -- this runs on GitHub for free.

name: tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  tests:
    name: Tests (unit + mocked, no real DB)
    runs-on: ubuntu-latest

    # Dummy values so that modules which read config at import time (via
    # config/settings.py) can be imported. No real secret is ever used or
    # needed here: the tests that run below never open a real connection.
    env:
      DB_PASSWORD: ci_dummy_password
      STORAGE_SECRET_KEY_INGESTION: ci_dummy_secret

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Run everything EXCEPT tests that need a real database, live internet,
      # or a full end-to-end pipeline. Those tiers require infrastructure that
      # is not wired into CI yet (see test/README.md).
      - name: Run tests
        run: pytest -m "not db and not network and not e2e" --cov --cov-report=term-missing

  # ---------------------------------------------------------------------------
  # Real-database integration tests. Spins up a disposable PostgreSQL, loads the
  # committed schema into it, and runs the `db`-marked tests against it. Every
  # such test rolls back its own transaction (see test/integration/conftest.py),
  # so the database is only ever a scratch instance that is thrown away with the
  # runner. This never touches any real environment.
  database-tests:
    name: Database integration tests (real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vinno_vigilance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    # Dummy values so config-reading modules import cleanly. The tests connect
    # via TEST_DATABASE_URL (below), not via these.
    env:
      DB_PASSWORD: ci_dummy_password
      STORAGE_SECRET_KEY_INGESTION: ci_dummy_secret

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Load the schema into the test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d vinno_vigilance_test \
            -v ON_ERROR_STOP=1 \
            -f db/schema/vigilance_core_standard_v2_phase1.sql

      - name: Run database integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vinno_vigilance_test
        run: pytest -m db
